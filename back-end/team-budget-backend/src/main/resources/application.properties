server.port=${PORT:8080}

# デプロイ先（Render等）の環境変数を優先し、未設定時のみデフォルトを使用
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-raspy-morning-b3sj96mb.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA・Hibernate設定（Neon上にusersテーブルを自動生成・更新）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect